<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciador de Campeonatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07110d;--bg2:#0a1712;--panel:#0e1c16;--panel2:#13251d;--panel3:#183026;
  --line:#1d3328;--line2:#29473a;--text:#eaf4ee;--muted:#8aa596;--dim:#5f7b6c;
  --accent:#22c55e;--accent-d:#16a34a;--accent-soft:rgba(34,197,94,.13);
  --gold:#fbbf24;--gold-soft:rgba(251,191,36,.12);--red:#f87171;--blue:#60a5fa;
  --r:16px;--shadow:0 18px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1100px 520px at 85% -12%,rgba(34,197,94,.13),transparent 60%),
  radial-gradient(800px 480px at -10% 8%,rgba(34,197,94,.07),transparent 60%),var(--bg)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color]{padding:3px;height:40px;width:52px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
h1,h2,h3{margin:0}
.cond{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.3px}

/* top bar */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,17,13,.8);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed';font-weight:800;font-size:21px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#34d36c,#15803d);display:grid;place-items:center;box-shadow:0 6px 18px rgba(34,197,94,.35);flex:none}
.brand em{font-style:normal;color:var(--accent)}
.spacer{flex:1}
#champSel{width:auto;max-width:240px;padding:8px 10px;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:9px 15px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,#2bd468,#16a34a);border-color:transparent;color:#03150a;box-shadow:0 8px 20px rgba(34,197,94,.25)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.btn.danger:hover{border-color:var(--red)}
.btn.gold{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#2a1a00;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:13px}
.btn svg{width:16px;height:16px}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}

/* home */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;padding:30px 0 34px}
.hero h1{font-family:'Barlow Condensed';font-size:clamp(40px,6vw,68px);line-height:.95;text-transform:uppercase;font-weight:800}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:540px;margin:18px 0 26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));padding:22px;box-shadow:var(--shadow);overflow:hidden}
.hero-art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 40px,transparent 40px 80px)}
.mini-row{position:relative;display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.mini-row:last-child{border:0}
.mini-row b{width:18px;color:var(--muted);font-weight:600}
.mini-row .n{flex:1}
.mini-row .p{font-weight:800;font-family:'Barlow Condensed';font-size:19px}
.mini-row.first .p{color:var(--gold)}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 40px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.feat .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.feat .ic svg{width:19px;height:19px}
.feat b{display:block;margin-bottom:4px}
.feat span{color:var(--muted);font-size:13.5px;line-height:1.5}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.sec-title h2{font-family:'Barlow Condensed';text-transform:uppercase;font-size:26px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ccard{text-align:left;background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.18s;display:flex;flex-direction:column;gap:10px}
.ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ccard h3{font-size:18px}
.ccard .meta{color:var(--muted);font-size:13px}
.ccard .chline{color:var(--gold);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fde68a;padding:12px 14px;border-radius:12px;margin-bottom:18px;font-size:14px}

/* champ header */
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.eyebrow.gold{color:var(--gold)}
.chead h1{font-family:'Barlow Condensed';font-size:clamp(32px,4.6vw,48px);text-transform:uppercase;line-height:1;margin:6px 0 8px;font-weight:800}
.chead .meta{color:var(--muted);font-size:14px}
.prog{min-width:220px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.prog .lbl b{color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .4s}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-family:'Barlow Condensed';text-transform:uppercase;font-size:22px;letter-spacing:.4px}
.note{color:var(--muted);font-size:13.5px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.stat .v{font-family:'Barlow Condensed';font-size:28px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-family:Inter;font-size:13px;color:var(--muted);font-weight:500}

/* badge */
.badge{--c:#16a34a;display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--c);font-family:'Barlow Condensed';font-weight:800;font-size:12.5px;letter-spacing:.3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.25)}
.badge.sm{width:24px;height:24px;font-size:10.5px;border-radius:7px}
.badge.lg{width:46px;height:46px;font-size:17px;border-radius:13px}
.badge.xl{width:84px;height:84px;font-size:30px;border-radius:22px}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:700;padding:8px 8px;text-align:center}
.tbl td{padding:9px 8px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .l{text-align:left}
.tbl td.pos{width:44px}
.pos span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
tr.q .pos span{background:var(--accent-soft);color:var(--accent)}
tr.lead .pos span{background:var(--gold-soft);color:var(--gold)}
.tcell{display:flex;align-items:center;gap:10px;font-weight:600;min-width:150px}
.tbl td.pts{font-weight:800;font-family:'Barlow Condensed';font-size:19px}
.form{display:inline-flex;gap:3px}
.fd{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.fd.V{background:var(--accent)}.fd.E{background:#9ca3af}.fd.D{background:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px}
.ggrid .card{margin:0}

/* matches */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rsec{margin-bottom:22px}
.rsec h4{font-family:'Barlow Condensed';text-transform:uppercase;font-size:18px;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.rsec h4:after{content:"";flex:1;height:1px;background:var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:10px}
.match{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:.15s;position:relative}
.match:not(:disabled):hover{border-color:var(--accent);background:var(--panel2)}
.match:disabled{opacity:.6}
.mlabel{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;min-height:13px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.side{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600;font-size:14.5px}
.side.home{justify-content:flex-end;text-align:right}
.side .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.win .tname{color:#fff}
.side.lose .tname{color:var(--muted);font-weight:500}
.side .ph{color:var(--dim);font-style:italic;font-weight:500;font-size:13.5px}
.score{min-width:74px;text-align:center;font-family:'Barlow Condensed';font-size:24px;font-weight:800;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px 10px;letter-spacing:1px}
.score i{font-style:normal;color:var(--dim);font-weight:600;margin:0 2px}
.score.pend{color:var(--dim);font-size:15px;padding:7px 10px;font-family:Inter;font-weight:600;letter-spacing:0}
.pens{text-align:center;font-size:12px;color:var(--gold);margin-top:5px;font-weight:600}

/* bracket */
.bracket{display:flex;gap:30px;overflow-x:auto;padding:6px 4px 14px;align-items:stretch}
.bcol{display:flex;flex-direction:column;min-width:220px;flex:none}
.bhead{font-family:'Barlow Condensed';text-transform:uppercase;font-size:16px;letter-spacing:.7px;color:var(--muted);text-align:center;margin-bottom:12px;font-weight:700}
.bslots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.bm{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;position:relative;transition:.15s}
.bm:not(:disabled):hover{border-color:var(--accent)}
.bm:after{content:"";position:absolute;right:-31px;top:50%;width:30px;height:1px;background:var(--line2)}
.bcol:nth-last-child(2) .bm:after{width:30px}
.bt{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13.5px;font-weight:600}
.bt+.bt{border-top:1px solid var(--line)}
.bt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .sc{font-family:'Barlow Condensed';font-weight:800;font-size:18px;min-width:18px;text-align:right}
.bt .sc small{font-size:12px;color:var(--gold);margin-left:3px}
.bt.w{background:rgba(34,197,94,.08)}
.bt.w .nm{color:#fff}
.bt.l .nm,.bt.l .sc{color:var(--dim)}
.bt .ph{color:var(--dim);font-style:italic;font-weight:500}
.bye{font-size:11.5px;color:var(--dim);padding:6px 10px;border-top:1px solid var(--line);font-style:italic}
.bchamp{border:1px solid rgba(251,191,36,.45);background:linear-gradient(160deg,rgba(251,191,36,.16),rgba(251,191,36,.03));border-radius:14px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700}
.bchamp svg{width:42px;height:42px}
.bchamp.none{opacity:.55;border-style:dashed}
.bm.champ-col:after,.bcol.last .bm:after{display:none}

/* champion banner */
.champ-banner{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:var(--r);margin-bottom:16px;border:1px solid rgba(251,191,36,.4);background:linear-gradient(110deg,rgba(251,191,36,.18),rgba(251,191,36,.04) 60%),var(--panel)}
.champ-banner .trophy svg{width:50px;height:50px;display:block}
.champ-banner .cb-name{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed';font-size:30px;font-weight:800;text-transform:uppercase;margin-top:3px}
.champ-banner>div:nth-child(2){flex:1;min-width:0}

/* scorers */
.sc-row .pl{font-weight:600}
.sc-row .gl{font-family:'Barlow Condensed';font-size:21px;font-weight:800;color:var(--accent)}
.top3 td.pos span{background:var(--gold-soft);color:var(--gold)}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tcard .row{display:flex;gap:10px;align-items:center}
.tcard .row input.nm{flex:1;font-weight:600}
.tcard .row input.sh{width:72px;text-transform:uppercase;text-align:center;font-weight:700}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px;min-height:10px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line2);border-radius:99px;padding:5px 6px 5px 11px;font-size:13px}
.pchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pchip button:hover{background:rgba(248,113,113,.18);color:var(--red)}
.addp{display:flex;gap:8px}
.addp input{padding:8px 11px;font-size:14px}

/* settings */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.danger-zone{border-color:rgba(248,113,113,.25)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,8,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow-y:auto;animation:fade .15s}
.modal{width:100%;max-width:560px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.modal.wide{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.mh h2{font-family:'Barlow Condensed';text-transform:uppercase;font-size:26px;letter-spacing:.4px}
.mx{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mx:hover{background:var(--panel3);color:var(--text)}
.mb{padding:16px 20px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px;flex-wrap:wrap}
.mf .left{margin-right:auto}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:0}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* score editor */
.sedit{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:4px 0 14px}
.steam{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;min-width:0}
.steam .nm{font-size:15px;line-height:1.25;word-break:break-word}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--panel3);border:1px solid var(--line2);font-size:20px;font-weight:700;line-height:1}
.stepper button:hover{border-color:var(--accent)}
.stepper input{width:64px;text-align:center;font-family:'Barlow Condensed';font-size:32px;font-weight:800;padding:2px 4px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sx{font-family:'Barlow Condensed';font-size:26px;color:var(--dim);font-weight:700}
.pen-box{background:var(--gold-soft);border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.pen-box .t{font-weight:700;color:var(--gold);font-size:14px;margin-bottom:10px;text-align:center}
.pen-box .sedit{margin:0}
.pen-box .stepper input{font-size:24px;width:54px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.goals h5{margin:0 0 8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.gsel{display:flex;flex-direction:column;gap:6px}
.gsel select{padding:7px 9px;font-size:13.5px}
.gsel .none{color:var(--dim);font-size:13px;font-style:italic}
.qadd{display:flex;gap:6px;margin-top:8px}
.qadd input{padding:7px 9px;font-size:13px}
.qadd button{padding:6px 10px}

/* wizard */
.fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmt{position:relative;display:block;border:1px solid var(--line2);border-radius:14px;padding:13px;background:var(--bg2);cursor:pointer;transition:.15s}
.fmt input{position:absolute;opacity:0;pointer-events:none}
.fmt b{display:block;font-size:14.5px;margin:6px 0 4px}
.fmt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.fmt svg{width:22px;height:22px;color:var(--muted)}
.fmt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fmt:has(input:checked) svg{color:var(--accent)}
.wz-sec{margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#wz .opt{display:none}
#wz[data-f="liga"] .o-liga,#wz[data-f="grupos"] .o-grupos,#wz[data-f="mata"] .o-mata{display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}

<script>
(() => {
'use strict';

/* ================= Dados e armazenamento ================= */
const LS_KEY = 'gc_campeonatos_v1';
let db = { champs: [], current: null };
let storageOk = true;
const state = { tab: null, jf: 'all', onlyPending: false, modal: null };

function load() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) { const d = JSON.parse(s); if (d && Array.isArray(d.champs)) db = d; }
  } catch (e) { storageOk = false; }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { storageOk = false; }
}

/* ================= Utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L = i => String.fromCharCode(65 + i);
const PALETTE = ['#16a34a', '#2563eb', '#dc2626', '#f59e0b', '#7c3aed', '#0891b2', '#db2777', '#ea580c', '#475569', '#65a30d', '#0f766e', '#9333ea', '#b91c1c', '#1d4ed8', '#ca8a04', '#be185d', '#e2e8f0', '#111827'];
const FORMAT = { liga: 'Pontos corridos', grupos: 'Grupos + mata-mata', mata: 'Mata-mata' };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nextPow2 = n => { let p = 1; while (p < n) p *= 2; return p; };

function shortName(n) {
  const w = n.trim().split(/\s+/).filter(x => !/^(de|da|do|dos|das|e|fc|ec|sc|ac|f\.c\.)$/i.test(x));
  if (!w.length) return n.trim().slice(0, 3).toUpperCase();
  let s;
  if (w.length >= 3) s = w.slice(0, 3).map(x => x[0]).join('');
  else if (w.length === 2) s = w[0].slice(0, 2) + w[1][0];
  else s = w[0].slice(0, 3);
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
}
function ink(hex) {
  const h = (hex || '#000').replace('#', '');
  const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#0b1410' : '#ffffff';
}
function badge(t, size = '') {
  if (!t) return '';
  return `<span class="badge ${size}" style="--c:${esc(t.color)};color:${ink(t.color)}">${esc(t.short)}</span>`;
}
let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

const ICON = {
  trophy: `<svg viewBox="0 0 64 64" class="tro"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs><path d="M18 8h28v14c0 9-6 16-14 16s-14-7-14-16V8z" fill="url(#tg)"/><path d="M18 12H9v5c0 6 4 10 10 10M46 12h9v5c0 6-4 10-10 10" fill="none" stroke="#f59e0b" stroke-width="3.5"/><path d="M28 38h8v8h-8z" fill="#d97706"/><path d="M20 46h24l2 10H18z" fill="url(#tg)"/><path d="M26 14l3 9" stroke="#fff7" stroke-width="3" stroke-linecap="round"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>`,
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  table: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>`,
  ball: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/><path d="M12 3v4M21 10l-5 0M3 10h5M9.5 15L7 19M14.5 15l2.5 4"/></svg>`,
  bracket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h5v6h4M3 17h5v-6M12 11h4v0M16 11h5"/><path d="M3 5v0M3 17v0"/></svg>`,
  groups: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>`,
  boot: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v7l9 3a2 2 0 0 1 1 2v2H4z"/><path d="M4 18v2M9 18v2M14 18v2M19 18v2"/></svg>`,
  img: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>`,
};

/* ================= Lógica do campeonato ================= */
const cur = () => db.champs.find(c => c.id === db.current) || null;
const team = (c, id) => c.teams.find(t => t.id === id) || null;
const isPlayed = m => m.hs != null && m.as != null;
const koMatches = c => c.ko ? c.ko.rounds.flat() : [];
const allMatches = c => [...c.matches, ...koMatches(c).filter(m => !m.bye)];
const groupMatches = (c, g) => c.matches.filter(m => m.stage === 'grupo' && m.group === g);
const groupDone = (c, g) => groupMatches(c, g).every(isPlayed);

function roundRobin(ids) {
  const t = [...ids]; if (t.length % 2) t.push(null);
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = t[i], b = t[n - 1 - i];
      if (a !== null && b !== null) pairs.push((r + i) % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return rounds;
}
function addRoundRobin(c, ids, stage, group) {
  const first = roundRobin(ids);
  const all = [...first];
  if (c.turns === 2) first.forEach(r => all.push(r.map(([a, b]) => [b, a])));
  all.forEach((pairs, ri) => pairs.forEach(([h, a]) => c.matches.push({
    id: uid(), stage, group, round: ri + 1, home: h, away: a, hs: null, as: null, goals: []
  })));
}
function seedOrder(size) {
  let o = [1];
  while (o.length < size) { const m = o.length * 2 + 1; o = o.flatMap(s => [s, m - s]); }
  return o;
}
function buildKO(c, srcs) {
  const n = srcs.length, size = nextPow2(Math.max(2, n));
  const order = seedOrder(size);
  const rounds = [];
  const r0 = [];
  for (let i = 0; i < size / 2; i++) {
    const s1 = order[2 * i], s2 = order[2 * i + 1];
    r0.push(newKO(0, i, s1 <= n ? srcs[s1 - 1] : { bye: true }, s2 <= n ? srcs[s2 - 1] : { bye: true }));
  }
  // evita confronto de times do mesmo grupo na 1ª fase do mata-mata
  const sameG = m => m.homeSrc.group != null && m.awaySrc.group != null && m.homeSrc.group === m.awaySrc.group;
  r0.forEach(m => {
    if (!sameG(m)) return;
    const k = r0.find(o => o !== m && o.awaySrc.group != null && o.homeSrc.group != null &&
      o.homeSrc.group !== m.awaySrc.group && m.homeSrc.group !== o.awaySrc.group);
    if (k) { const t = m.awaySrc; m.awaySrc = k.awaySrc; k.awaySrc = t; }
  });
  rounds.push(r0);
  let cnt = size / 4, r = 1;
  while (cnt >= 1) {
    const arr = []; for (let i = 0; i < cnt; i++) arr.push(newKO(r, i, null, null));
    rounds.push(arr); cnt /= 2; r++;
  }
  c.ko = { size, rounds };
}
function newKO(r, i, homeSrc, awaySrc) {
  return { id: uid(), stage: 'ko', r, i, homeSrc, awaySrc, home: undefined, away: undefined, hs: null, as: null, ph: null, pa: null, goals: [], bye: false };
}
function generate(c) {
  c.matches = []; c.ko = null; c.groups = []; c.celebrated = false;
  let ids = c.teams.map(t => t.id);
  if (c.shuffle && c.format !== 'liga') ids = shuffle(ids);
  if (c.format === 'liga') {
    addRoundRobin(c, ids, 'liga', null);
  } else if (c.format === 'grupos') {
    const G = c.groupsN;
    const groups = Array.from({ length: G }, () => []);
    ids.forEach((id, i) => {
      const row = Math.floor(i / G), pos = i % G;
      groups[row % 2 === 0 ? pos : G - 1 - pos].push(id);
    });
    c.groups = groups;
    groups.forEach((g, gi) => addRoundRobin(c, g, 'grupo', gi));
    const srcs = [];
    for (let p = 0; p < c.qualPer; p++) for (let g = 0; g < G; g++) srcs.push({ group: g, pos: p });
    buildKO(c, srcs);
  } else {
    buildKO(c, ids.map(id => ({ team: id })));
  }
  rebuildKO(c);
}
function clearResult(m) { m.hs = null; m.as = null; m.ph = null; m.pa = null; m.goals = []; }
function resolveSrc(c, src) {
  if (!src) return null;
  if (src.bye) return 'BYE';
  if (src.team) return src.team;
  if (src.group != null) {
    if (!groupDone(c, src.group)) return null;
    const rows = standings(c, c.groups[src.group], groupMatches(c, src.group));
    return rows[src.pos] ? rows[src.pos].id : null;
  }
  return null;
}
function winnerOf(m) {
  if (!m) return null;
  if (m.bye) return m.home === 'BYE' ? (m.away || null) : (m.home || null);
  if (!m.home || !m.away || !isPlayed(m)) return null;
  if (m.hs > m.as) return m.home;
  if (m.as > m.hs) return m.away;
  if (m.ph != null && m.pa != null && m.ph !== m.pa) return m.ph > m.pa ? m.home : m.away;
  return null;
}
function loserOf(m) {
  const w = winnerOf(m); if (!w || m.bye) return null;
  return w === m.home ? m.away : m.home;
}
function rebuildKO(c) {
  if (!c.ko) return;
  const R = c.ko.rounds;
  R.forEach((round, r) => round.forEach((m, i) => {
    let h, a;
    if (r === 0) { h = resolveSrc(c, m.homeSrc); a = resolveSrc(c, m.awaySrc); }
    else { h = winnerOf(R[r - 1][2 * i]); a = winnerOf(R[r - 1][2 * i + 1]); }
    if (m.home !== h || m.away !== a) { m.home = h; m.away = a; clearResult(m); }
    m.bye = h === 'BYE' || a === 'BYE';
  }));
}
function standings(c, teamIds, matches) {
  const pts = c.pts || { w: 3, d: 1, l: 0 };
  const rows = new Map(teamIds.map(id => [id, { id, P: 0, J: 0, V: 0, E: 0, D: 0, GP: 0, GC: 0, SG: 0, form: [] }]));
  [...matches].sort((a, b) => a.round - b.round).forEach(m => {
    if (!isPlayed(m)) return;
    const h = rows.get(m.home), a = rows.get(m.away);
    if (!h || !a) return;
    h.J++; a.J++; h.GP += m.hs; h.GC += m.as; a.GP += m.as; a.GC += m.hs;
    if (m.hs > m.as) { h.V++; a.D++; h.form.push('V'); a.form.push('D'); }
    else if (m.hs < m.as) { a.V++; h.D++; a.form.push('V'); h.form.push('D'); }
    else { h.E++; a.E++; h.form.push('E'); a.form.push('E'); }
  });
  const list = [...rows.values()];
  list.forEach(r => { r.P = r.V * pts.w + r.E * pts.d + r.D * pts.l; r.SG = r.GP - r.GC; });
  const name = id => (team(c, id) || {}).name || '';
  list.sort((x, y) => y.P - x.P || y.V - x.V || y.SG - x.SG || y.GP - x.GP || name(x.id).localeCompare(name(y.id)));
  return list;
}
function champion(c) {
  if (c.format === 'liga') {
    if (c.matches.length && c.matches.every(isPlayed)) return standings(c, c.teams.map(t => t.id), c.matches)[0].id;
    return null;
  }
  if (!c.ko) return null;
  const R = c.ko.rounds;
  return winnerOf(R[R.length - 1][0]);
}
function progress(c) {
  const ko = koMatches(c).filter(m => !m.bye);
  const total = c.matches.length + ko.length;
  const played = c.matches.filter(isPlayed).length + ko.filter(isPlayed).length;
  return { total, played, pct: total ? Math.round(played / total * 100) : 0 };
}
function roundName(n) {
  return ({ 1: 'Final', 2: 'Semifinal', 4: 'Quartas de final', 8: 'Oitavas de final' })[n] || `${n}-avos de final`;
}
function srcLabel(c, m, side) {
  if (m.r === 0) {
    const s = side === 'h' ? m.homeSrc : m.awaySrc;
    if (s && s.group != null) return `${s.pos + 1}º do Grupo ${L(s.group)}`;
  }
  return 'A definir';
}
function scorers(c) {
  const pl = new Map();
  c.teams.forEach(t => t.players.forEach(p => pl.set(p.id, { p, t })));
  const count = new Map(); let unknown = 0, og = 0;
  allMatches(c).forEach(m => (m.goals || []).forEach(g => {
    if (g.og) { og++; return; }
    const x = g.player && pl.get(g.player);
    if (!x) { unknown++; return; }
    count.set(g.player, (count.get(g.player) || 0) + 1);
  }));
  const list = [...count].map(([id, n]) => ({ ...pl.get(id), n }))
    .sort((a, b) => b.n - a.n || a.p.name.localeCompare(b.p.name));
  return { list, unknown, og };
}
function teamTotals(c) {
  const map = new Map(c.teams.map(t => [t.id, { id: t.id, GP: 0, GC: 0, J: 0 }]));
  allMatches(c).forEach(m => {
    if (!isPlayed(m)) return;
    const h = map.get(m.home), a = map.get(m.away);
    if (!h || !a) return;
    h.J++; a.J++; h.GP += m.hs; h.GC += m.as; a.GP += m.as; a.GC += m.hs;
  });
  return [...map.values()];
}
function findMatch(c, id) { return c.matches.find(m => m.id === id) || koMatches(c).find(m => m.id === id) || null; }

/* ================= Render: topo ================= */
function renderTop() {
  const c = cur();
  let h = '';
  if (db.champs.length) {
    h += `<select id="champSel" aria-label="Escolher campeonato">
      <option value="">Meus campeonatos</option>
      ${db.champs.map(x => `<option value="${x.id}" ${c && c.id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
    </select>`;
  }
  h += `<button class="btn primary sm" id="newTop" data-action="new">${ICON.plus}<span class="t">Novo campeonato</span></button>`;
  $('#topActions').innerHTML = h;
}

/* ================= Render: início ================= */
function renderHome() {
  let h = '';
  if (!storageOk) h += `<div class="warn">Seu navegador está bloqueando o armazenamento local. Os campeonatos funcionam, mas somem ao fechar a página. Use <b>Exportar</b> para guardar uma cópia.</div>`;
  h += `<section class="hero">
    <div>
      <div class="eyebrow">Tabela, jogos, artilharia e chave</div>
      <h1 style="margin-top:10px">Seu campeonato,<br><span>organizado de verdade.</span></h1>
      <p>Cadastre os times, escolha o formato e a tabela sai pronta. Lance os placares e a classificação, a artilharia e o mata-mata se atualizam sozinhos.</p>
      <div class="hero-actions">
        <button class="btn primary lg" data-action="new">${ICON.plus} Criar campeonato</button>
        <button class="btn lg" data-action="import">${ICON.up} Importar</button>
      </div>
    </div>
    <div class="hero-art">
      <div class="eyebrow" style="position:relative;margin-bottom:8px">Classificação</div>
      ${[['ATB', '#16a34a', 'Atlético Barreiraense', 19], ['VER', '#2563eb', 'Verdeal', 16], ['POR', '#dc2626', 'Portuários', 14], ['UNI', '#f59e0b', 'União da Serra', 11], ['CRI', '#7c3aed', 'CRIAS FC', 9]]
        .map((r, i) => `<div class="mini-row ${i === 0 ? 'first' : ''}"><b>${i + 1}</b><span class="badge sm" style="--c:${r[1]};color:#fff">${r[0]}</span><span class="n">${r[2]}</span><span class="p">${r[3]}</span></div>`).join('')}
    </div>
  </section>
  <section class="features">
    <div class="feat"><div class="ic">${ICON.table}</div><b>Três formatos</b><span>Pontos corridos, grupos + mata-mata ou mata-mata direto.</span></div>
    <div class="feat"><div class="ic">${ICON.ball}</div><b>Placar e gols</b><span>Lance o resultado e quem marcou. Empate no mata-mata vai para os pênaltis.</span></div>
    <div class="feat"><div class="ic">${ICON.boot}</div><b>Artilharia</b><span>Ranking de goleadores, melhor ataque e defesa menos vazada.</span></div>
    <div class="feat"><div class="ic">${ICON.img}</div><b>Imagem pronta</b><span>Gere uma imagem da classificação para mandar no grupo.</span></div>
  </section>
  <div class="sec-title"><h2>Meus campeonatos</h2></div>`;
  if (!db.champs.length) {
    h += `<div class="empty">Nenhum campeonato ainda. <br><br><button class="btn primary" data-action="new">${ICON.plus} Criar o primeiro</button></div>`;
  } else {
    h += `<div class="cgrid">${db.champs.map(c => {
      const p = progress(c), ch = champion(c), t = ch && team(c, ch);
      return `<button class="ccard" data-action="open" data-id="${c.id}">
        <div class="eyebrow">${FORMAT[c.format]}</div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${c.teams.length} times · ${p.played}/${p.total} jogos</div>
        <div class="bar"><div style="width:${p.pct}%"></div></div>
        ${t ? `<div class="chline">🏆 ${badge(t, 'sm')} ${esc(t.name)}</div>` : ''}
      </button>`;
    }).join('')}</div>`;
  }
  return h;
}

/* ================= Render: campeonato ================= */
function tabsFor(c) {
  const end = [['artilharia', 'Artilharia'], ['times', 'Times'], ['ajustes', 'Ajustes']];
  if (c.format === 'liga') return [['tabela', 'Classificação'], ['jogos', 'Jogos'], ...end];
  if (c.format === 'grupos') return [['tabela', 'Grupos'], ['jogos', 'Jogos'], ['chave', 'Mata-mata'], ...end];
  return [['chave', 'Chave'], ['jogos', 'Jogos'], ...end];
}
function renderChamp(c) {
  const tabs = tabsFor(c);
  if (!tabs.some(t => t[0] === state.tab)) state.tab = tabs[0][0];
  const p = progress(c);
  let h = `<div class="chead">
    <div>
      <div class="eyebrow">${FORMAT[c.format]}${c.format !== 'mata' ? (c.turns === 2 ? ' · turno e returno' : ' · turno único') : ''}</div>
      <h1>${esc(c.name)}</h1>
      <div class="meta">${c.teams.length} times${c.format === 'grupos' ? ` · ${c.groupsN} grupos · ${c.qualPer} classificado${c.qualPer > 1 ? 's' : ''} por grupo` : ''}</div>
    </div>
    <div class="prog"><div class="lbl"><span>Jogos disputados</span><b>${p.played}/${p.total}</b></div><div class="bar"><div style="width:${p.pct}%"></div></div></div>
  </div>
  <nav class="tabs">${tabs.map(([k, l]) => `<button class="tab ${state.tab === k ? 'on' : ''}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</nav>`;
  const fn = { tabela: renderTabela, jogos: renderJogos, chave: renderChave, artilharia: renderArtilharia, times: renderTimes, ajustes: renderAjustes }[state.tab];
  h += `<section>${fn(c)}</section>`;
  return h;
}
function championBanner(c) {
  const id = champion(c); if (!id) return '';
  const t = team(c, id); if (!t) return '';
  return `<div class="champ-banner"><div class="trophy">${ICON.trophy}</div>
    <div><div class="eyebrow gold">Campeão</div><div class="cb-name">${badge(t, 'lg')}<span>${esc(t.name)}</span></div></div>
    <button class="btn gold sm" data-action="celebrate">🎉 Comemorar</button></div>`;
}
function statCards(c) {
  const p = progress(c);
  const ms = allMatches(c).filter(isPlayed);
  const goals = ms.reduce((s, m) => s + m.hs + m.as, 0);
  const avg = ms.length ? (goals / ms.length).toFixed(2).replace('.', ',') : '0';
  const top = scorers(c).list[0];
  const st = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="stats">${st('Jogos', `${p.played}<small> / ${p.total}</small>`)}${st('Gols', goals)}${st('Média de gols', avg)}${st('Artilheiro', top ? `${esc(top.p.name)} <small>${top.n}</small>` : '—')}</div>`;
}
function tableHTML(c, rows, opt = {}) {
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>#</th><th class="l">Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th>
    <th class="hide-sm">GP</th><th class="hide-sm">GC</th><th>SG</th><th class="hide-sm">Últimos</th></tr></thead><tbody>
    ${rows.map((r, i) => {
      const t = team(c, r.id);
      let cls = '';
      if (opt.qual && i < opt.qual) cls = 'q';
      if (opt.lead && i === 0 && r.J > 0) cls = 'lead';
      const form = r.form.slice(-5);
      return `<tr class="${cls}"><td class="pos"><span>${i + 1}</span></td>
        <td class="l"><div class="tcell">${badge(t, 'sm')}<span>${esc(t ? t.name : '?')}</span></div></td>
        <td class="pts">${r.P}</td><td>${r.J}</td><td>${r.V}</td><td>${r.E}</td><td>${r.D}</td>
        <td class="hide-sm">${r.GP}</td><td class="hide-sm">${r.GC}</td><td>${r.SG > 0 ? '+' : ''}${r.SG}</td>
        <td class="hide-sm"><span class="form">${form.map(f => `<i class="fd ${f}" title="${({ V: 'Vitória', E: 'Empate', D: 'Derrota' })[f]}"></i>`).join('') || '<span style="color:var(--dim)">—</span>'}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function renderTabela(c) {
  let h = championBanner(c) + statCards(c);
  const imgBtn = `<button class="btn sm" data-action="img">${ICON.down} Imagem da tabela</button>`;
  if (c.format === 'liga') {
    const rows = standings(c, c.teams.map(t => t.id), c.matches);
    h += `<div class="card"><div class="card-h"><h3>Classificação</h3>${imgBtn}</div>${tableHTML(c, rows, { lead: true })}
      <div class="legend"><span>Critérios: pontos, vitórias, saldo de gols, gols pró.</span><span>Vitória ${c.pts.w} · Empate ${c.pts.d} · Derrota ${c.pts.l}</span></div></div>`;
  } else {
    h += `<div class="card-h"><h3 class="cond" style="font-size:22px;text-transform:uppercase">Fase de grupos</h3>${imgBtn}</div>`;
    h += `<div class="ggrid">${c.groups.map((g, gi) => {
      const rows = standings(c, g, groupMatches(c, gi));
      const done = groupDone(c, gi);
      return `<div class="card"><div class="card-h"><h3>Grupo ${L(gi)}</h3><span class="note">${done ? '✔ Encerrado' : `${groupMatches(c, gi).filter(isPlayed).length}/${groupMatches(c, gi).length} jogos`}</span></div>${tableHTML(c, rows, { qual: c.qualPer })}</div>`;
    }).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Classificados para o mata-mata</span><span>Critérios: pontos, vitórias, saldo de gols, gols pró.</span></div>`;
  }
  return h;
}
function matchCard(c, m, label) {
  const h = m.home && m.home !== 'BYE' ? team(c, m.home) : null;
  const a = m.away && m.away !== 'BYE' ? team(c, m.away) : null;
  const ready = h && a;
  const pl = isPlayed(m);
  const w = pl ? winnerOf(m) : null;
  const draw = pl && m.stage !== 'ko' && m.hs === m.as;
  const cls = id => !pl || draw ? '' : (w === id ? 'win' : 'lose');
  const score = pl ? `<div class="score">${m.hs}<i> × </i>${m.as}</div>` : `<div class="score pend">${ready ? 'Lançar' : 'vs'}</div>`;
  const pens = m.stage === 'ko' && pl && m.hs === m.as ? `<div class="pens">Pênaltis: ${m.ph} × ${m.pa}</div>` : '';
  return `<button class="match" ${ready ? `data-action="match" data-mid="${m.id}"` : 'disabled'}>
    <div class="mlabel">${esc(label || '')}</div>
    <div class="mrow">
      <div class="side home ${h ? cls(h.id) : ''}"><span class="tname">${h ? esc(h.name) : `<span class="ph">${srcLabel(c, m, 'h')}</span>`}</span>${badge(h, 'sm')}</div>
      ${score}
      <div class="side away ${a ? cls(a.id) : ''}">${badge(a, 'sm')}<span class="tname">${a ? esc(a.name) : `<span class="ph">${srcLabel(c, m, 'a')}</span>`}</span></div>
    </div>${pens}</button>`;
}
function byRound(ms) {
  const map = new Map();
  ms.forEach(m => { if (!map.has(m.round)) map.set(m.round, []); map.get(m.round).push(m); });
  return [...map].sort((a, b) => a[0] - b[0]);
}
function renderJogos(c) {
  const f = state.jf;
  let chips = '';
  if (c.format === 'grupos') {
    chips += [['all', 'Todos'], ...c.groups.map((_, i) => [String(i), 'Grupo ' + L(i)]), ['ko', 'Mata-mata']]
      .map(([v, l]) => `<button class="chip ${f === v ? 'on' : ''}" data-action="jf" data-v="${v}">${l}</button>`).join('');
  }
  chips += `<button class="chip ${state.onlyPending ? 'on' : ''}" data-action="pend">Só pendentes</button>`;
  const secs = [];
  if (c.format === 'liga') byRound(c.matches).forEach(([r, ms]) => secs.push({ t: `Rodada ${r}`, ms: ms.map(m => [m, '']) }));
  if (c.format === 'grupos' && f !== 'ko') {
    const gm = c.matches.filter(m => f === 'all' || m.group === +f);
    byRound(gm).forEach(([r, ms]) => secs.push({ t: `Rodada ${r}${f === 'all' ? ' · fase de grupos' : ''}`, ms: ms.map(m => [m, 'Grupo ' + L(m.group)]) }));
  }
  if (c.ko && (c.format === 'mata' || f === 'all' || f === 'ko')) {
    c.ko.rounds.forEach(round => {
      const ms = round.filter(m => !m.bye);
      if (ms.length) secs.push({ t: roundName(round.length), ms: ms.map(m => [m, roundName(round.length)]) });
    });
  }
  let h = `<div class="filters">${chips}<span class="note" style="margin-left:auto">Toque num jogo para lançar ou editar o placar.</span></div>`;
  const out = secs.map(s => ({ ...s, ms: state.onlyPending ? s.ms.filter(([m]) => !isPlayed(m)) : s.ms })).filter(s => s.ms.length);
  if (!out.length) h += `<div class="empty">${state.onlyPending ? 'Nenhum jogo pendente aqui. 👏' : 'Nenhum jogo.'}</div>`;
  out.forEach(s => {
    h += `<div class="rsec"><h4>${s.t}</h4><div class="mgrid">${s.ms.map(([m, l]) => matchCard(c, m, l)).join('')}</div></div>`;
  });
  return h;
}
function bMatch(c, m) {
  const side = (id, sc, pen, k) => {
    if (id === 'BYE') return '';
    const t = id ? team(c, id) : null;
    const w = winnerOf(m);
    const pl = isPlayed(m);
    const cls = !m.bye && pl && w ? (w === id ? 'w' : 'l') : (m.bye && t ? 'w' : '');
    return `<div class="bt ${cls}">${t ? badge(t, 'sm') : ''}<span class="nm">${t ? esc(t.name) : `<span class="ph">${srcLabel(c, m, k)}</span>`}</span>
      <span class="sc">${pl ? sc : ''}${pl && m.hs === m.as ? `<small>(${pen})</small>` : ''}</span></div>`;
  };
  const ready = m.home && m.away && !m.bye;
  if (m.bye) {
    const id = m.home === 'BYE' ? m.away : m.home;
    return `<div class="bm">${side(id, '', '', m.home === 'BYE' ? 'a' : 'h')}<div class="bye">Avança direto (sem adversário)</div></div>`;
  }
  return `<button class="bm" ${ready ? `data-action="match" data-mid="${m.id}"` : 'disabled'}>${side(m.home, m.hs, m.ph, 'h')}${side(m.away, m.as, m.pa, 'a')}</button>`;
}
function renderChave(c) {
  const R = c.ko.rounds;
  let h = championBanner(c);
  if (c.format === 'grupos' && !c.groups.every((_, g) => groupDone(c, g)))
    h += `<p class="note" style="margin:0 0 14px">Os confrontos vão sendo preenchidos assim que cada grupo termina.</p>`;
  if (c.format === 'mata' && !h) h += statCards(c);
  const ch = champion(c), t = ch && team(c, ch);
  h += `<div class="card"><div class="bracket">
    ${R.map(round => `<div class="bcol"><div class="bhead">${roundName(round.length)}</div><div class="bslots">${round.map(m => bMatch(c, m)).join('')}</div></div>`).join('')}
    <div class="bcol last"><div class="bhead">Campeão</div><div class="bslots"><div class="bchamp ${t ? '' : 'none'}">${ICON.trophy}${t ? `<div style="display:flex;align-items:center;gap:8px">${badge(t, 'sm')}${esc(t.name)}</div>` : '<span class="note">A definir</span>'}</div></div></div>
  </div></div>`;
  return h;
}
function renderArtilharia(c) {
  const { list, unknown, og } = scorers(c);
  const tt = teamTotals(c).filter(x => x.J > 0);
  let h = '';
  if (tt.length) {
    const atk = [...tt].sort((a, b) => b.GP - a.GP)[0];
    const def = [...tt].sort((a, b) => a.GC - b.GC)[0];
    const st = (k, t, v) => `<div class="stat"><div class="k">${k}</div><div class="v" style="display:flex;align-items:center;gap:8px">${badge(team(c, t), 'sm')}<span style="overflow:hidden;text-overflow:ellipsis">${esc(team(c, t).name)}</span> <small>${v}</small></div></div>`;
    h += `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${st('Melhor ataque', atk.id, atk.GP + ' gols')}${st('Defesa menos vazada', def.id, def.GC + ' sofridos')}</div>`;
  }
  h += `<div class="card"><div class="card-h"><h3>Artilharia</h3></div>`;
  if (!list.length) {
    h += `<div class="empty">Ainda não há gols com autor.<br>Ao lançar um placar, escolha quem marcou cada gol. Cadastre os jogadores na aba <b>Times</b> ou direto na tela do jogo.</div>`;
  } else {
    let pos = 0, last = null;
    h += `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th class="l">Jogador</th><th class="l">Time</th><th>Gols</th></tr></thead><tbody>
      ${list.map((x, i) => { if (x.n !== last) { pos = i + 1; last = x.n; }
        return `<tr class="sc-row ${pos <= 3 ? 'top3' : ''}"><td class="pos"><span>${pos}</span></td><td class="l pl">${esc(x.p.name)}</td>
        <td class="l"><div class="tcell">${badge(x.t, 'sm')}<span>${esc(x.t.name)}</span></div></td><td class="gl">${x.n}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  if (unknown || og) h += `<p class="note" style="margin:12px 0 0">${unknown ? `${unknown} gol${unknown > 1 ? 's' : ''} sem autor informado. ` : ''}${og ? `${og} gol${og > 1 ? 's' : ''} contra.` : ''}</p>`;
  h += `</div>`;
  return h;
}
function renderTimes(c) {
  return `<p class="note" style="margin:0 0 16px">Edite nome, sigla e cor de cada time e cadastre os jogadores para a artilharia. As alterações são salvas na hora.</p>
  <div class="tgrid">${c.teams.map(t => `<div class="tcard">
    <div class="row">${badge(t, 'lg')}

function renderAjustes(c) {
  const pts = c.format !== 'mata' ? `<div class="wz-sec"><label class="f">Pontuação</label><div class="form-grid">

    <div class="actions"><button class="btn danger" data-action="regen">Gerar tabela de novo</button><button class="btn danger" data-action="delchamp">Excluir campeonato</button></div></div>`;
}

function render() {
  renderTop();
  const c = cur();
  $('#app').innerHTML = c ? renderChamp(c) : renderHome();
}

/* ================= Modais ================= */
function openModal(html, cls = '') {
  $('#modal-root').innerHTML = `<div class="overlay" data-action="overlay"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
}
function closeModal() {
  $('#modal-root').innerHTML = ''; state.modal = null; document.body.classList.remove('noscroll');
}
const mHead = t => `<div class="mh"><h2>${t}</h2><button class="mx" data-action="close" aria-label="Fechar">${ICON.x}</button></div>`;

function confirmBox(title, text, okLabel, onOk) {
  state.modal = { type: 'confirm', onOk };
  openModal(`${mHead(esc(title))}<div class="mb"><p class="note" style="font-size:15px;margin:0">${text}</p></div>
    <div class="mf"><button class="btn ghost" data-action="close">Cancelar</button><button class="btn danger" data-action="confirm-ok">${esc(okLabel)}</button></div>`);
}

function wzTeams() {

}
function wzHint() {
  const form = $('#wz'); if (!form) return;
  const f = form.dataset.f, names = wzTeams(), n = names.length;
  $('#wzCount').textContent = n ? `· ${n}` : '';

  const hint = $('#wzHint');

  const turns = +$('#wzTurns').value;
  if (f === 'liga') {
    const games = n * (n - 1) / 2 * turns, rounds = (n % 2 ? n : n - 1) * turns;
    hint.innerHTML = `<b>${rounds} rodadas</b> · ${games} jogos no total.`;
  } else if (f === 'mata') {

    hint.innerHTML = `1ª fase: <b>${roundName(size / 2)}</b>${byes ? ` · ${byes} time${byes > 1 ? 's avançam' : ' avança'} direto na 1ª fase` : ''}.`;
  } else {

    const min = Math.floor(n / G), max = Math.ceil(n / G);
    const q = G * Q, size = nextPow2(q);
    hint.innerHTML = `${G} grupo${G > 1 ? 's' : ''} de ${min === max ? min : `${min} a ${max}`} times · <b>${q} classificados</b> → 1ª fase do mata-mata: <b>${roundName(size / 2)}</b>${size > q ? ` (${size - q} avança${size - q > 1 ? 'm' : ''} direto)` : ''}.`;

function wzCreate() {

/* ----- Lançar placar ----- */
function openMatch(mid) {
  const c = cur(); const m = findMatch(c, mid); if (!m) return;
  const toSel = side => (m.goals || []).filter(g => g.team === (side === 'h' ? m.home : m.away)).map(g => g.og ? 'og' : (g.player || ''));
  state.modal = { type: 'match', mid, hs: m.hs, as: m.as, ph: m.ph, pa: m.pa, hg: toSel('h'), ag: toSel('a'), err: '' };
  renderMatchModal();
}
function matchTitle(c, m) {
  if (m.stage === 'ko') return roundName(c.ko.rounds[m.r].length);
  if (m.stage === 'grupo') return `Grupo ${L(m.group)} · Rodada ${m.round}`;
  return `Rodada ${m.round}`;
}
function renderMatchModal() {
  const c = cur(), s = state.modal, m = findMatch(c, s.mid);
  const h = team(c, m.home), a = team(c, m.away);
  openModal(`${mHead(esc(matchTitle(c, m)))}
  <div class="mb">
    <div class="sedit">
      <div class="steam">${badge(h, 'lg')}<span class="nm">${esc(h.name)}</span>${stp('hs', s.hs)}</div>
      <div class="sx">×</div>
      <div class="steam">${badge(a, 'lg')}<span class="nm">${esc(a.name)}</span>${stp('as', s.as)}</div>

  </div>
  <div class="mf">${isPlayed(m) ? `<button class="btn danger left" data-action="m-clear">Apagar resultado</button>` : ''}
    <button class="btn ghost" data-action="close">Cancelar</button><button class="btn primary" data-action="m-save">Salvar placar</button></div>`);
}
const stp = (k, v) => `<div class="stepper"><button type="button" data-action="sc" data-k="${k}" data-d="-1">−</button><input type="number" inputmode="numeric" min="0" max="99" data-sf="${k}" value="${v == null ? '' : v}" placeholder="–"><button type="button" data-action="sc" data-k="${k}" data-d="1">+</button></div>`;
function matchDyn() {
  const c = cur(), s = state.modal, m = findMatch(c, s.mid);
  const h = team(c, m.home), a = team(c, m.away);
  const tie = m.stage === 'ko' && s.hs != null && s.as != null && s.hs === s.as;
  const gopts = (t, val) => `<option value="">Não informado</option>${t.players.map(p => `<option value="${p.id}" ${val === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="og" ${val === 'og' ? 'selected' : ''}>Gol contra</option>`;
  const gcol = (side, t, n) => {

    if (!n) x += `<span class="none">Sem gols</span>`;
    for (let i = 0; i < n; i++) x += `<select data-goal="${side}" data-idx="${i}">${gopts(t, arr[i] || '')}</select>`;
    x += `</div>${n ? `<div class="qadd"><input data-np="${side}" placeholder="Novo jogador" maxlength="40"><button class="btn sm" data-action="mnp" data-side="${side}">+</button></div>` : ''}</div>`;
    return x;
  };
  const showGoals = (s.hs || 0) + (s.as || 0) > 0;
  return `${tie ? `<div class="pen-box"><div class="t">Empate! Placar dos pênaltis</div><div class="sedit">
      <div class="steam">${stp('ph', s.ph)}</div><div class="sx">×</div><div class="steam">${stp('pa', s.pa)}</div></div></div>` : ''}
    ${showGoals ? `<div class="goals">${gcol('h', h, s.hs || 0)}${gcol('a', a, s.as || 0)}</div>` : ''}

}
function refreshDyn() { const d = $('#mDyn'); if (d) d.innerHTML = matchDyn(); }
function readModalInputs() {
  const s = state.modal; if (!s || s.type !== 'match') return;
  document.querySelectorAll('[data-sf]').forEach(inp => {
    const v = inp.value.trim(); s[inp.dataset.sf] = v === '' ? null : Math.max(0, Math.min(99, parseInt(v, 10) || 0));
  });
  document.querySelectorAll('[data-goal]').forEach(sel => {
    (sel.dataset.goal === 'h' ? s.hg : s.ag)[+sel.dataset.idx] = sel.value;
  });
}
function saveMatch() {
  readModalInputs();
  const c = cur(), s = state.modal, m = findMatch(c, s.mid);
  const fail = msg => { s.err = msg; refreshDyn(); };
  if (s.hs == null && s.as == null) return clearMatch();
  if (s.hs == null || s.as == null) return fail('Preencha o placar dos dois times.');
  if (m.stage === 'ko' && s.hs === s.as) {
    if (s.ph == null || s.pa == null) return fail('No mata-mata, empate vai para os pênaltis: preencha o placar dos pênaltis.');
    if (s.ph === s.pa) return fail('Os pênaltis precisam ter um vencedor.');
  }
  m.hs = s.hs; m.as = s.as;
  if (m.stage === 'ko' && s.hs === s.as) { m.ph = s.ph; m.pa = s.pa; } else { m.ph = null; m.pa = null; }
  const mk = (arr, n, tid) => arr.slice(0, n).concat(Array(Math.max(0, n - arr.length)).fill('')).map(v => ({ team: tid, player: v && v !== 'og' ? v : null, og: v === 'og' }));
  m.goals = [...mk(s.hg, s.hs, m.home), ...mk(s.ag, s.as, m.away)];
  closeModal(); afterChange(c);
  toast('Placar salvo!');
}
function clearMatch() {

}
function afterChange(c) {

  if (ch && !c.celebrated) { c.celebrated = true; party = true; }

function confetti() {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = 'block';
  const colors = ['#22c55e', '#fbbf24', '#ffffff', '#16a34a', '#fde68a', '#4ade80'];
  const ps = Array.from({ length: 220 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 7,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.random() * colors.length | 0]
  }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.x += p.vx + Math.sin((t + p.s * 100) / 400) * .6; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t - t0 < 5500) requestAnimationFrame(f); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  })(t0);
}

/* ----- Imagem da classificação ----- */
async function makeImage(c) {
  try { await document.fonts.ready; } catch (e) {}
  const blocks = c.format === 'liga'
    ? [{ t: 'Classificação', rows: standings(c, c.teams.map(t => t.id), c.matches), q: 0 }]
    : c.groups.map((g, gi) => ({ t: 'Grupo ' + L(gi), rows: standings(c, g, groupMatches(c, gi)), q: c.qualPer }));
  const W = 1080, pad = 60, rowH = 62, head = 46;
  let H = 230;
  blocks.forEach(b => { H += 56 + head + b.rows.length * rowH + 34; });
  H += 90;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d2219'); g.addColorStop(1, '#06100c');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const rg = x.createRadialGradient(W * .85, 0, 10, W * .85, 0, 600); rg.addColorStop(0, 'rgba(34,197,94,.22)'); rg.addColorStop(1, 'rgba(34,197,94,0)');
  x.fillStyle = rg; x.fillRect(0, 0, W, H);
  const F = (w, s, fam = 'Inter') => `${w} ${s}px ${fam === 'B' ? "'Barlow Condensed', Inter, sans-serif" : 'Inter, sans-serif'}`;
  x.fillStyle = '#22c55e'; x.font = F(700, 22); x.textBaseline = 'alphabetic';
  x.fillText(FORMAT[c.format].toUpperCase(), pad, 92);
  x.fillStyle = '#ffffff'; x.font = F(800, 66, 'B');
  let title = c.name.toUpperCase();
  while (x.measureText(title).width > W - pad * 2 && title.length > 4) title = title.slice(0, -2);
  if (title !== c.name.toUpperCase()) title = title.trim() + '…';
  x.fillText(title, pad, 160);
  const p = progress(c);
  x.fillStyle = '#8aa596'; x.font = F(500, 22);
  x.fillText(`${p.played} de ${p.total} jogos disputados`, pad, 198);
  let y = 250;
  const cols = [['P', 0], ['J', 1], ['V', 2], ['E', 3], ['D', 4], ['SG', 5]];
  const colX = i => W - pad - 30 - (5 - i) * 78;
  const ellip = (s, max) => { if (x.measureText(s).width <= max) return s; while (s.length > 1 && x.measureText(s + '…').width > max) s = s.slice(0, -1); return s + '…'; };
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  blocks.forEach(b => {
    if (blocks.length > 1 || c.format !== 'liga') { x.fillStyle = '#ffffff'; x.font = F(800, 34, 'B'); x.fillText(b.t.toUpperCase(), pad, y + 34); }
    else { x.fillStyle = '#ffffff'; x.font = F(800, 34, 'B'); x.fillText('CLASSIFICAÇÃO', pad, y + 34); }
    y += 56;
    rr(pad - 16, y, W - pad * 2 + 32, head + b.rows.length * rowH + 12, 18); x.fillStyle = 'rgba(255,255,255,.035)'; x.fill();
    x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1.5; x.stroke();
    x.fillStyle = '#5f7b6c'; x.font = F(700, 17);
    x.fillText('#', pad + 8, y + 31); x.fillText('TIME', pad + 112, y + 31);
    x.textAlign = 'center'; cols.forEach(([l, i]) => x.fillText(l, colX(i), y + 31)); x.textAlign = 'left';
    y += head;
    b.rows.forEach((r, i) => {
      const t = team(c, r.id);
      const ry = y + i * rowH;
      x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(pad, ry, W - pad * 2, 1);
      const lead = c.format === 'liga' && i === 0 && r.J > 0, q = b.q && i < b.q;
      if (lead || q) { rr(pad, ry + 15, 34, 34, 9); x.fillStyle = lead ? 'rgba(251,191,36,.18)' : 'rgba(34,197,94,.16)'; x.fill(); }
      x.fillStyle = lead ? '#fbbf24' : q ? '#22c55e' : '#8aa596'; x.font = F(700, 20); x.textAlign = 'center';
      x.fillText(String(i + 1), pad + 17, ry + 39);
      rr(pad + 54, ry + 12, 40, 40, 11); x.fillStyle = t.color; x.fill();
      x.fillStyle = ink(t.color); x.font = F(800, 17, 'B'); x.fillText(t.short, pad + 74, ry + 38);
      x.textAlign = 'left'; x.fillStyle = '#eaf4ee'; x.font = F(600, 24);
      x.fillText(ellip(t.name, colX(0) - 50 - (pad + 112)), pad + 112, ry + 40);
      x.textAlign = 'center';
      cols.forEach(([l, ci]) => {
        const v = l === 'SG' ? (r.SG > 0 ? '+' : '') + r.SG : r[l];
        x.fillStyle = l === 'P' ? '#ffffff' : '#b9cdc2'; x.font = l === 'P' ? F(800, 30, 'B') : F(500, 22);
        x.fillText(String(v), colX(ci), ry + 41);
      });
      x.textAlign = 'left';
    });
    y += b.rows.length * rowH + 12 + 34;
  });
  x.fillStyle = '#5f7b6c'; x.font = F(500, 18);
  const d = new Date();
  x.fillText(`Atualizado em ${d.toLocaleDateString('pt-BR')} · Gerenciador de Campeonatos`, pad, H - 34);
  return cv.toDataURL('image/png');
}

/* ================= Eventos ================= */
const actions = {
  home() { db.current = null; save(); render(); window.scrollTo(0, 0); },
  new: openWizard,
  import: showImport,
  open(el) { db.current = el.dataset.id; state.tab = null; state.jf = 'all'; state.onlyPending = false; save(); render(); window.scrollTo(0, 0); },
  tab(el) { state.tab = el.dataset.tab; render(); },
  jf(el) { state.jf = el.dataset.v; render(); },
  pend() { state.onlyPending = !state.onlyPending; render(); },
  overlay(el, e) { if (e.target === el && state.modal && state.modal.type !== 'wizard') closeModal(); },
  close: closeModal,
  'confirm-ok'() { const f = state.modal && state.modal.onOk; closeModal(); if (f) f(); },
  'wz-create': wzCreate,
  match(el) { openMatch(el.dataset.mid); },
  sc(el) {
    readModalInputs();
    const s = state.modal, k = el.dataset.k, d = +el.dataset.d;
    s[k] = Math.max(0, Math.min(99, (s[k] == null ? 0 : s[k]) + d));
    const inp = document.querySelector(`[data-sf="${k}"]`); if (inp) inp.value = s[k];
    s.err = ''; if (k === 'hs' || k === 'as') refreshDyn();
  },
  mnp(el) {
    readModalInputs();
    const side = el.dataset.side, c = cur(), m = findMatch(c, state.modal.mid);
    const inp = document.querySelector(`[data-np="${side}"]`);
    const name = inp && inp.value.trim(); if (!name) { if (inp) inp.focus(); return; }
    const t = team(c, side === 'h' ? m.home : m.away);
    const p = { id: uid(), name }; t.players.push(p); save();
    const arr = side === 'h' ? state.modal.hg : state.modal.ag;
    const n = side === 'h' ? state.modal.hs : state.modal.as;
    for (let i = 0; i < n; i++) if (!arr[i]) { arr[i] = p.id; break; }
    refreshDyn();
  },
  'm-save': saveMatch,
  'm-clear'() { clearMatch(); },
  celebrate() { const c = cur(); celebrate(c, champion(c)); },
  img: showImage,
  addp(el) {
    const c = cur(), t = team(c, el.dataset.tid), inp = $('#np-' + t.id);
    const name = inp.value.trim(); if (!name) { inp.focus(); return; }
    t.players.push({ id: uid(), name }); save(); render();
    const again = $('#np-' + t.id); if (again) again.focus();
  },
  delp(el) {
    const c = cur(), t = team(c, el.dataset.tid);
    t.players = t.players.filter(p => p.id !== el.dataset.pid); save(); render();
  },
  saveset() {
    const c = cur(); const n = $('#setName').value.trim();
    if (n) c.name = n;
    if ($('#setW')) c.pts = { w: +$('#setW').value || 0, d: +$('#setD').value || 0, l: +$('#setL').value || 0 };
    afterChange(c); toast('Alterações salvas.');
  },
  export: showExport,
  'copy-exp'() {
    const t = $('#expTxt');
    const ok = () => toast('Código copiado!');
    try { navigator.clipboard.writeText(state.modal.json).then(ok, () => { t.select(); document.execCommand('copy'); ok(); }); }
    catch (e) { t.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('Selecione o texto e copie manualmente.'); } }
  },
  'pick-file'() { $('#importFile').click(); },
  'imp-go'() { const e = importText($('#impTxt').value); if (e) $('#impErr').textContent = e; },
  regen() {
    confirmBox('Gerar tabela de novo?', 'Todos os resultados e gols deste campeonato serão apagados. Os times e jogadores continuam.', 'Gerar de novo', () => {
      const c = cur(); generate(c); save(); render(); toast('Tabela gerada de novo.');
    });
  },
  delchamp() {
    const c = cur();
    confirmBox('Excluir campeonato?', `"${esc(c.name)}" será apagado deste navegador. Isso não pode ser desfeito.`, 'Excluir', () => {
      db.champs = db.champs.filter(x => x.id !== c.id); db.current = null; save(); render(); toast('Campeonato excluído.');
    });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A') return;
  if (el.dataset.action !== 'overlay') e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'champSel') { db.current = el.value || null; state.tab = null; state.jf = 'all'; state.onlyPending = false; save(); render(); window.scrollTo(0, 0); return; }
  if (el.name === 'fmt') { $('#wz').dataset.f = el.value; wzHint(); return; }
  if (['wzTurns', 'wzG', 'wzQ'].includes(el.id)) { wzHint(); return; }
  if (el.dataset.tfield) {
    const c = cur(), t = team(c, el.dataset.tid); const f = el.dataset.tfield;
    let v = el.value.trim();
    if (f === 'name') { if (!v) { el.value = t.name; return; } t.name = v; }
    if (f === 'short') { v = v.toUpperCase().slice(0, 4); if (!v) v = shortName(t.name); t.short = v; }
    if (f === 'color') t.color = el.value;
    save(); render(); return;
  }
  if (el.dataset.sf) { readModalInputs(); state.modal.err = ''; if (el.dataset.sf === 'hs' || el.dataset.sf === 'as') refreshDyn(); return; }
  if (el.dataset.goal) { readModalInputs(); return; }
  if (el.id === 'importFile') {
    const file = el.files && el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const err = importText(String(rd.result)); if (err) { if (state.modal && state.modal.type === 'import') $('#impErr').textContent = err; else toast(err); } };
    rd.readAsText(file); el.value = '';
  }
});
document.addEventListener('input', e => { if (e.target.id === 'wzTeams') wzHint(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal) { closeModal(); return; }
  if (e.key === 'Enter') {
    const el = e.target;
    if (el.classList && el.classList.contains('np-input')) { e.preventDefault(); actions.addp(el); }
    else if (el.dataset && el.dataset.np) { e.preventDefault(); actions.mnp({ dataset: { side: el.dataset.np } }); }
    else if (el.dataset && el.dataset.sf) { e.preventDefault(); readModalInputs(); saveMatch(); }
    else if (el.closest && el.closest('#wz') && el.tagName !== 'TEXTAREA') { e.preventDefault(); wzCreate(); }
  }
});

load();
if (db.current && !cur()) db.current = null;
render();
})();
</script>
</body>
</html>
